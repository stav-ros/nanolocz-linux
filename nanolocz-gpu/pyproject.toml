[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanolocz"
version = "0.1.0.dev0"
description = "Linux-first Python/CUDA port of NanoLocz"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "NanoLocz Python Team"},
]
keywords = ["afm", "microscopy", "image-analysis", "particle-tracking", "gpu", "cuda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "h5py>=3.12",
    "tifffile>=2024.8",
    "scikit-learn>=1.5",
    "hdbscan>=0.8",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-qt>=4.2",      # For Napari GUI tests
    "zarr>=2.18",
]
dev = [
    "nanolocz[test,gpu,napari]",
    "pytest-cov>=5",
    "mypy>=1.10",
    "black>=24",
    "flake8>=7",
    "ruff>=0.9",
    "pre-commit>=4.2",
]
gpu = ["cupy-cuda12x>=13"]
napari = [
    "napari[pyqt6]>=0.5",   # Includes PyQt6 Qt bindings
    "magicgui>=0.9",
]
gui = [
    "PyQt6>=6.7",
    "pyqtgraph>=0.13",
]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "numpydoc>=1.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanolocz*"]

[project.scripts]
nanolocz = "nanolocz.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
